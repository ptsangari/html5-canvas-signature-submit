<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="sign.js"></script>
    <link rel="stylesheet" href="styles.css">
    <title>Signature Pad</title>
</head>
<body>
    <form id="signatureForm">

        <div class="row">
            <div class="col-md-4">
                <p>Signature:</p>
                <div id="canvas">
                    <canvas class="roundCorners" id="newSignature" style="position: relative; margin: 0; padding: 0; border: 1px solid #c4caac;" width="276" height="180"></canvas>
                </div>
                <script type="text/javascript">signatureCapture();</script>
                <button type="button" class="btn btn-primary" onclick="signatureSave()">Preview signature</button>
                <button type="button" class="btn btn-primary" onclick="signatureClear()">Clear signature</button>
            </div>
    
            <div class="col-md-4">
                <p>Preview Signature:</p>
                <img fetchpriority="high" id="signaturePreview" alt="Preview Signature">
                <input type="text" class="d-none" id="signatureInput" name="signatureInput" required="">
                <div class="invalid-feedback">Please sign and preview your signature before you proceed.</div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-12 mt-5">
                <button type="button" class="btn btn-primary" onclick="submitSignature()">Submit</button>
            </div> 
        </div>

    </form>
</body>
</html>
